name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager -i config/brakeman.ignore

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag docket-ci .

      - name: Verify packaged Rails, libvips, and PostgreSQL client versions
        run: |
          docker run --rm --entrypoint bundle docket-ci exec ruby -e \
            'require "rails"; require "vips"; abort unless Rails.version == "8.1.3.1"; abort if Gem::Version.new(Vips.version_string) < Gem::Version.new("8.13")'
          docker run --rm --entrypoint pg_dump docket-ci --version | grep 'PostgreSQL) 16\.'
          docker run --rm --entrypoint pg_restore docket-ci --version | grep 'PostgreSQL) 16\.'

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # The suite above runs on SQLite (the zero-config dev/demo engine). Netcore
  # runs Postgres, and several queries behave differently there (json has no
  # LIKE operator; full-text search uses tsquery). This leg runs the same suite
  # against Postgres so those never regress. PARALLEL_WORKERS=1 keeps the first
  # green deterministic; raise it once the Postgres run has proven stable.
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests on Postgres
        env:
          RAILS_ENV: test
          PARALLEL_WORKERS: 1
          DATABASE_URL: postgres://docket:docket@localhost:5432/docket_test
        run: bin/rails db:test:prepare test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Boot a throwaway instance and run the release smoke loop
        run: bin/smoke

  system-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Run System Tests
        env:
          RAILS_ENV: test
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Live OIDC (staff + customer planes) against containerised Keycloak
  # (handoff §5A / G3 artifact).
  keycloak-sso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Boot Keycloak with the docket-test realm
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v $PWD/test/keycloak/realm-docket-test.json:/opt/keycloak/data/import/realm.json:ro \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          for i in $(seq 1 90); do
            curl -fs http://localhost:8080/realms/docket-test/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          echo "Keycloak did not become ready" && docker logs keycloak && exit 1

      - name: Run live SSO tests
        env:
          RAILS_ENV: test
          KEYCLOAK_URL: http://localhost:8080
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          bin/rails db:test:prepare
          bin/rails test test/system/sso_keycloak_live_test.rb

      - name: Keep screenshots from failed SSO tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sso-screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
