shared: &shared
  sla_breach_sweep:
    class: SlaBreachSweepJob
    queue: default
    schedule: every 5 minutes
  sla_risk_sweep:
    class: SlaRiskSweepJob
    queue: default
    schedule: every 5 minutes
  sequence_runner:
    class: SequenceRunnerJob
    queue: default
    schedule: every hour at minute 5
  sequence_delivery_sweep:
    class: SequenceDeliverySweepJob
    queue: default
    schedule: every 5 minutes
  session_sweep:
    class: SessionSweepJob
    queue: default
    schedule: every hour at minute 20
  connector_scheduler:
    class: ConnectorSchedulerJob
    queue: default
    schedule: every 5 minutes
  decisioning_run:
    class: DecisioningRunJob
    queue: default
    schedule: every hour at minute 40
  routing_rule_scheduler:
    class: RoutingRuleSchedulerJob
    queue: default
    schedule: every 5 minutes
  escalation_sweep:
    class: EscalationSweepJob
    queue: default
    schedule: every 5 minutes
  storage_deletion_sweep:
    class: StorageDeletionSweepJob
    queue: default
    schedule: every 5 minutes
  mail_delivery_sweep:
    class: MailDeliverySweepJob
    queue: default
    schedule: every 5 minutes

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
